#
# Only an explicit manual action requests deployment. Secret values never enter
# repository_dispatch plaintext; infra decrypts them with its SSH identity.
# Registry credentials are owned by infra and never forwarded by the producer.
name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: h-ua-bot-production
  cancel-in-progress: false

jobs:
  request:
    name: Request encrypted infra deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    env:
      INFRA_REPOSITORY: aiaiaiai-org/infra
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_REF: ${{ github.ref }}
      HUA_TELEGRAM_TOKEN: ${{ secrets.HUA_TELEGRAM_TOKEN }}
      HUA_HUB_TOKEN: ${{ secrets.HUA_HUB_TOKEN }}
      HUA_DELIVERY_SECRET: ${{ secrets.HUA_DELIVERY_SECRET }}
      HUA_HUB_ORIGIN: ${{ vars.HUA_HUB_ORIGIN || 'https://api.aiaiaiai.org/prism-hub' }}
      HUA_HUB_PROVIDER_SCOPE: ${{ vars.HUA_HUB_PROVIDER_SCOPE || 'h-ua-bot' }}
      HUA_ALERT_CHANNEL: ${{ vars.HUA_ALERT_CHANNEL || 'alerts' }}
      HUA_SOURCES: ${{ vars.HUA_SOURCES || 'vanek_nikolaev' }}
      INFRA_DEPLOY_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
    steps:
      - name: Validate release and deployment credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RELEASE_REF" = refs/heads/master || {
            echo "::error::Deploy only a merged master commit." >&2
            exit 1
          }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          for name in HUA_TELEGRAM_TOKEN HUA_HUB_TOKEN HUA_DELIVERY_SECRET INFRA_DEPLOY_TOKEN; do
            test -n "${!name:-}" || {
              echo "::error::Production credential $name is missing." >&2
              exit 1
            }
            [[ "${!name}" != *$'\n'* && "${!name}" != *$'\r'* ]] || {
              echo "::error::Production credential $name must be one line." >&2
              exit 1
            }
          done
          for name in HUA_HUB_ORIGIN HUA_HUB_PROVIDER_SCOPE HUA_ALERT_CHANNEL HUA_SOURCES; do
            [[ "${!name}" =~ ^[A-Za-z0-9_./:@+,-]+$ ]] || {
              echo "::error::Invalid producer variable $name." >&2
              exit 1
            }
          done
          (( ${#HUA_DELIVERY_SECRET} >= 32 )) || {
            echo "::error::HUA_DELIVERY_SECRET must be at least 32 characters." >&2
            exit 1
          }

      - name: Verify immutable image is available
        shell: bash
        env:
          IMAGE: ghcr.io/0x0sky/h-ua-bot:${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker buildx imagetools inspect "$IMAGE" >/dev/null || {
            echo "::error::Master image is not published. Wait for Image workflow." >&2
            exit 1
          }
          docker logout ghcr.io >/dev/null

      - name: Fetch infra-owned encryption recipient
        id: recipient
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          REQUEST_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          umask 077
          recipient_dir="$RUNNER_TEMP/infra-recipient"
          mkdir -p "$recipient_dir"
          jq -n --arg workload h-ua-bot --arg request_id "$REQUEST_ID" \
            '{event_type: "issue-workload-recipient", client_payload: {
              workload: $workload, request_id: $request_id
            }}' > "$RUNNER_TEMP/recipient-request.json"
          trap 'rm -f "$RUNNER_TEMP/recipient-request.json"' EXIT
          gh api --method POST "repos/${INFRA_REPOSITORY}/dispatches" \
            --input "$RUNNER_TEMP/recipient-request.json"

          # The producer run ID uniquely correlates a request and its public artifact.
          recipient_run=""
          for attempt in $(seq 1 180); do
            runs="$(gh api "repos/${INFRA_REPOSITORY}/actions/workflows/issue-workload-recipient.yml/runs?event=repository_dispatch&per_page=50")"
            recipient_run="$(jq -c --arg title "Recipient h-ua-bot / ${REQUEST_ID}" \
              '[.workflow_runs[] | select(.display_title == $title and .event == "repository_dispatch" and .head_branch == "master")][0] // empty' <<< "$runs")"
            if [[ -n "$recipient_run" ]]; then
              status="$(jq -r '.status' <<< "$recipient_run")"
              if [[ "$status" == completed ]]; then
                conclusion="$(jq -r '.conclusion' <<< "$recipient_run")"
                if [[ "$conclusion" != success ]]; then
                  echo "::error::Infra recipient run failed: $(jq -r '.html_url' <<< "$recipient_run")" >&2
                  exit 1
                fi
                break
              fi
            fi
            sleep 5
          done
          [[ -n "$recipient_run" && "$(jq -r '.status' <<< "$recipient_run")" == completed ]] || {
            echo "::error::Timed out waiting for the correlated infra recipient run." >&2
            exit 1
          }
          run_id="$(jq -r '.id' <<< "$recipient_run")"
          gh run download "$run_id" --repo "$INFRA_REPOSITORY" \
            --name "recipient-h-ua-bot-$REQUEST_ID" --dir "$recipient_dir"
          test -s "$recipient_dir/recipient.pub"
          [[ "$(wc -l < "$recipient_dir/recipient.pub")" -eq 1 ]]
          ssh-keygen -lf "$recipient_dir/recipient.pub" >/dev/null
          recipient="$(cat "$recipient_dir/recipient.pub")"
          [[ "$recipient" =~ ^ssh-(ed25519|rsa)\ [A-Za-z0-9+/=]+([[:space:]].*)?$ ]] || {
            echo "::error::Infra supplied an invalid public encryption recipient." >&2
            exit 1
          }
          printf 'key=%s\n' "$recipient" >> "$GITHUB_OUTPUT"

      - name: Encrypt and dispatch scoped runtime credentials
        shell: bash
        env:
          IMAGE: ghcr.io/0x0sky/h-ua-bot:${{ github.sha }}
          INFRA_AGE_RECIPIENT: ${{ steps.recipient.outputs.key }}
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          umask 077
          cleanup() {
            rm -f "$RUNNER_TEMP/hua-source.env" "$RUNNER_TEMP/hua-secrets.age" "$RUNNER_TEMP/hua-dispatch.json"
          }
          trap cleanup EXIT
          {
            printf 'HUA_TELEGRAM_TOKEN=%s\n' "$HUA_TELEGRAM_TOKEN"
            printf 'HUA_HUB_TOKEN=%s\n' "$HUA_HUB_TOKEN"
            printf 'HUA_DELIVERY_SECRET=%s\n' "$HUA_DELIVERY_SECRET"
            printf 'HUA_HUB_ORIGIN=%s\n' "$HUA_HUB_ORIGIN"
            printf 'HUA_HUB_PROVIDER_SCOPE=%s\n' "$HUA_HUB_PROVIDER_SCOPE"
            printf 'HUA_ALERT_CHANNEL=%s\n' "$HUA_ALERT_CHANNEL"
            printf 'HUA_SOURCES=%s\n' "$HUA_SOURCES"
          } > "$RUNNER_TEMP/hua-source.env"
          age --armor --recipient "$INFRA_AGE_RECIPIENT" \
            --output "$RUNNER_TEMP/hua-secrets.age" "$RUNNER_TEMP/hua-source.env"

          jq -n \
            --arg workload h-ua-bot \
            --arg image "$IMAGE" \
            --arg source "$GITHUB_REPOSITORY" \
            --arg ref "$RELEASE_SHA" \
            --rawfile envelope "$RUNNER_TEMP/hua-secrets.age" \
            '{event_type: "deploy-workload", client_payload: {
              workload: $workload, image: $image,
              source_repository: $source, ref: $ref, secrets_age: $envelope
            }}' > "$RUNNER_TEMP/hua-dispatch.json"

          gh api --method POST "repos/${INFRA_REPOSITORY}/dispatches" --input "$RUNNER_TEMP/hua-dispatch.json"
          {
            echo "### Deployment requested (not yet confirmed)"
            echo
            echo "- Workload: \`h-ua-bot\`"
            echo "- Source commit: \`$RELEASE_SHA\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Destination: \`$INFRA_REPOSITORY\`"
            echo "- Credentials: encrypted for infra production SSH identity"
            echo
            echo "Verify the corresponding infra Deploy workload run before claiming activation."
          } >> "$GITHUB_STEP_SUMMARY"
