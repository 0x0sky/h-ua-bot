name: Validate deploy contract

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/validate-deploy.yml'
      - 'docs/production-deploy.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate encrypted handoff and manual activation
        shell: bash
        run: |
          set -Eeuo pipefail
          file=.github/workflows/deploy-production.yml
          validate_contract() {
            local candidate="$1"
            grep -Fq 'workflow_dispatch:' "$candidate" || return 1
            if grep -Eq '^[[:space:]]+push:' "$candidate"; then
              echo "::error::Automatic deployment on push is forbidden." >&2
              return 1
            fi
            grep -Fq 'environment:' "$candidate" || return 1
            grep -Fq 'name: production' "$candidate" || return 1
            grep -Fq 'issue-workload-recipient' "$candidate" || return 1
            grep -Fq 'gh run download' "$candidate" || return 1
            grep -Fq 'age --armor --recipient' "$candidate" || return 1
            grep -Fq 'HUA_TELEGRAM_TOKEN=%s' "$candidate" || return 1
            grep -Fq 'HUA_HUB_TOKEN=%s' "$candidate" || return 1
            grep -Fq 'HUA_DELIVERY_SECRET=%s' "$candidate" || return 1
            grep -Fq 'secrets_age: $envelope' "$candidate" || return 1
            grep -Fq 'repos/${INFRA_REPOSITORY}/dispatches' "$candidate" || return 1
            grep -Fq 'refs/heads/master' "$candidate" || return 1
            for forbidden in 'SSH_PRIVATE_KEY' 'toJSON(secrets)' 'vars.INFRA_AGE_RECIPIENT' 'secrets.GHCR_PULL_TOKEN' 'vars.GHCR_PULL_USER' 'GHCR_PULL_TOKEN=%s' 'GHCR_PULL_USER=%s'; do
              if grep -Fq "$forbidden" "$candidate"; then
                echo "::error::Forbidden producer-owned setting: $forbidden" >&2
                return 1
              fi
            done
          }

          validate_contract "$file"

          # Mutation regression cases: each forbidden construct must fail.
          fixtures="$(mktemp -d)"
          trap 'rm -rf "$fixtures"' EXIT
          cp "$file" "$fixtures/push.yml"
          sed -i '/^on:$/a\  push:' "$fixtures/push.yml"
          grep -Fq '  push:' "$fixtures/push.yml"
          if validate_contract "$fixtures/push.yml"; then
            echo "::error::Push trigger regression was accepted." >&2
            exit 1
          fi

          cp "$file" "$fixtures/ssh.yml"
          printf '%s\n' '      SSH_PRIVATE_KEY: forbidden' >> "$fixtures/ssh.yml"
          if validate_contract "$fixtures/ssh.yml"; then
            echo "::error::Private key regression was accepted." >&2
            exit 1
          fi

          cp "$file" "$fixtures/secrets.yml"
          printf '%s\n' '      forbidden: toJSON(secrets)' >> "$fixtures/secrets.yml"
          if validate_contract "$fixtures/secrets.yml"; then
            echo "::error::All-secrets regression was accepted." >&2
            exit 1
          fi

          for forbidden in 'vars.INFRA_AGE_RECIPIENT' 'secrets.GHCR_PULL_TOKEN' 'vars.GHCR_PULL_USER'; do
            cp "$file" "$fixtures/foreign.yml"
            printf '%s\n' "      forbidden: $forbidden" >> "$fixtures/foreign.yml"
            if validate_contract "$fixtures/foreign.yml"; then
              echo "::error::Foreign infra setting regression was accepted: $forbidden" >&2
              exit 1
            fi
          done
